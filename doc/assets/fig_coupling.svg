<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>

  <!-- 面板底色 -->
  <g fill="#F7F8FA" stroke="#E2E5EA" stroke-width="1.5">
    <rect x="30" y="20" width="420" height="480" rx="14"/>
    <rect x="490" y="20" width="420" height="480" rx="14"/>
    <rect x="950" y="20" width="420" height="480" rx="14"/>
  </g>

  <!-- 标题 -->
  <g font-size="26" font-weight="700" fill="#1F2937" text-anchor="middle">
    <text x="240" y="66">(a) 随机配对</text>
    <text x="700" y="66">(b) 最优传输配对</text>
    <text x="1160" y="66">(c) 最优传输配对 + 布朗桥</text>
  </g>

  <!-- 列标签 -->
  <g font-size="20" text-anchor="middle">
    <g fill="#2E9E5B">
      <text x="120" y="118">原神</text><text x="580" y="118">原神</text><text x="1040" y="118">原神</text>
    </g>
    <g fill="#4A6FA5">
      <text x="360" y="118">鸣潮</text><text x="820" y="118">鸣潮</text><text x="1280" y="118">鸣潮</text>
    </g>
  </g>

  <!-- (a) 随机配对：连线交叉 -->
  <g stroke="#B8BCC4" stroke-width="3" fill="none">
    <line x1="120" y1="160" x2="360" y2="300"/>
    <line x1="120" y1="230" x2="360" y2="160"/>
    <line x1="120" y1="300" x2="360" y2="370"/>
    <line x1="120" y1="370" x2="360" y2="230"/>
  </g>

  <!-- (b) OT 配对：连线不交叉，但每条都很细 -->
  <g stroke="#6B7280" stroke-width="3" fill="none">
    <line x1="580" y1="160" x2="820" y2="160"/>
    <line x1="580" y1="230" x2="820" y2="230"/>
    <line x1="580" y1="300" x2="820" y2="300"/>
    <line x1="580" y1="370" x2="820" y2="370"/>
  </g>

  <!-- (c) OT + 布朗桥：两端收紧、中间撑开 -->
  <g fill="#E08A2C" fill-opacity="0.26" stroke="none">
    <path d="M1040 160 Q1160 116 1280 160 Q1160 204 1040 160 Z"/>
    <path d="M1040 230 Q1160 186 1280 230 Q1160 274 1040 230 Z"/>
    <path d="M1040 300 Q1160 256 1280 300 Q1160 344 1040 300 Z"/>
    <path d="M1040 370 Q1160 326 1280 370 Q1160 414 1040 370 Z"/>
  </g>
  <g stroke="#C46F14" stroke-width="2.2" fill="none" stroke-linejoin="round">
    <path d="M1040 160 L1070 155 L1100 168 L1130 149 L1160 171 L1190 152 L1220 166 L1250 157 L1280 160"/>
    <path d="M1040 230 L1070 236 L1100 222 L1130 241 L1160 219 L1190 238 L1220 225 L1250 233 L1280 230"/>
    <path d="M1040 300 L1070 296 L1100 309 L1130 290 L1160 311 L1190 293 L1220 306 L1250 297 L1280 300"/>
    <path d="M1040 370 L1070 375 L1100 362 L1130 381 L1160 360 L1190 378 L1220 365 L1250 373 L1280 370"/>
  </g>

  <!-- 数据点 -->
  <g fill="#2E9E5B" stroke="#ffffff" stroke-width="2.5">
    <circle cx="120" cy="160" r="11"/><circle cx="120" cy="230" r="11"/><circle cx="120" cy="300" r="11"/><circle cx="120" cy="370" r="11"/>
    <circle cx="580" cy="160" r="11"/><circle cx="580" cy="230" r="11"/><circle cx="580" cy="300" r="11"/><circle cx="580" cy="370" r="11"/>
    <circle cx="1040" cy="160" r="11"/><circle cx="1040" cy="230" r="11"/><circle cx="1040" cy="300" r="11"/><circle cx="1040" cy="370" r="11"/>
  </g>
  <g fill="#4A6FA5" stroke="#ffffff" stroke-width="2.5">
    <circle cx="360" cy="160" r="11"/><circle cx="360" cy="230" r="11"/><circle cx="360" cy="300" r="11"/><circle cx="360" cy="370" r="11"/>
    <circle cx="820" cy="160" r="11"/><circle cx="820" cy="230" r="11"/><circle cx="820" cy="300" r="11"/><circle cx="820" cy="370" r="11"/>
    <circle cx="1280" cy="160" r="11"/><circle cx="1280" cy="230" r="11"/><circle cx="1280" cy="300" r="11"/><circle cx="1280" cy="370" r="11"/>
  </g>

  <!-- 结论 -->
  <g font-size="20" fill="#374151" text-anchor="middle">
    <text x="240" y="442">谁配谁是随机的</text>
    <text x="240" y="472">分布对得上，内容对不上</text>
    <text x="700" y="442">相近的配在一起，内容一致</text>
    <text x="700" y="472">但路径太窄，网络难学</text>
    <text x="1160" y="442">两端不动，中间用噪声撑开</text>
    <text x="1160" y="472">内容一致，路径也好学</text>
  </g>
</svg>
