<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6B7280"/></marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C46F14"/></marker>
  </defs>
  <rect width="1400" height="520" fill="#ffffff"/>

  <rect x="20" y="20" width="1360" height="200" rx="16" fill="#F7F8FA" stroke="#E2E5EA" stroke-width="1.5"/>
  <rect x="20" y="320" width="1360" height="180" rx="16" fill="#F7F8FA" stroke="#E2E5EA" stroke-width="1.5"/>
  <text x="48" y="62" font-size="26" font-weight="700" fill="#1F2937">teacher：多步薛定谔桥流</text>
  <text x="372" y="61" font-size="18" fill="#6B7280">慢，但转换质量和内容一致性由它负责</text>
  <text x="48" y="362" font-size="26" font-weight="700" fill="#1F2937">student：单步模型</text>
  <text x="290" y="361" font-size="18" fill="#6B7280">快，直接在像素空间帧到帧，绕开自编码器</text>

  <!-- teacher 管线 -->
  <g fill="#ffffff" stroke="#9CA3AF" stroke-width="2">
    <rect x="48" y="92" width="190" height="100" rx="12"/>
    <rect x="1162" y="92" width="190" height="100" rx="12"/>
  </g>
  <g fill="#FDECEC" stroke="#C0504D" stroke-width="2.5">
    <rect x="290" y="92" width="230" height="100" rx="12"/>
    <rect x="880" y="92" width="230" height="100" rx="12"/>
  </g>
  <rect x="572" y="92" width="256" height="100" rx="12" fill="#EAF6EE" stroke="#2E9E5B" stroke-width="2.5"/>

  <g text-anchor="middle">
    <g font-size="21" font-weight="700" fill="#1F2937">
      <text x="143" y="150">游戏画面</text>
      <text x="405" y="134">自编码器编码</text>
      <text x="700" y="134">DiT 积分若干步</text>
      <text x="995" y="134">自编码器解码</text>
      <text x="1257" y="150">转换结果</text>
    </g>
    <g font-size="18">
      <text x="405" y="166" fill="#C0504D">耗时的大头</text>
      <text x="700" y="166" fill="#2E9E5B">其实很快</text>
      <text x="995" y="166" fill="#C0504D">耗时的大头</text>
    </g>
  </g>
  <g stroke="#6B7280" stroke-width="2.5" fill="none" marker-end="url(#ah)">
    <line x1="238" y1="142" x2="286" y2="142"/>
    <line x1="520" y1="142" x2="568" y2="142"/>
    <line x1="828" y1="142" x2="876" y2="142"/>
    <line x1="1110" y1="142" x2="1158" y2="142"/>
  </g>

  <!-- 蒸馏 -->
  <line x1="700" y1="222" x2="700" y2="314" stroke="#C46F14" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ahO)"/>
  <text x="676" y="278" font-size="22" font-weight="700" fill="#C46F14" text-anchor="end">蒸馏</text>
  <text x="724" y="262" font-size="18" fill="#6B7280">teacher 是确定性的，一个输入只对应一个目标，</text>
  <text x="724" y="290" font-size="18" fill="#6B7280">所以蒸馏就是配对回归；时序约束也加在这一步</text>

  <!-- student 管线 -->
  <g fill="#ffffff" stroke="#9CA3AF" stroke-width="2">
    <rect x="48" y="386" width="190" height="90" rx="12"/>
    <rect x="1162" y="386" width="190" height="90" rx="12"/>
  </g>
  <rect x="440" y="386" width="520" height="90" rx="12" fill="#FCF1E3" stroke="#C46F14" stroke-width="2.5"/>
  <g text-anchor="middle" font-size="21" font-weight="700" fill="#1F2937">
    <text x="143" y="439">游戏画面</text>
    <text x="700" y="427">一次前向的小网络</text>
    <text x="1257" y="439">转换结果</text>
  </g>
  <text x="700" y="456" font-size="18" fill="#4B5563" text-anchor="middle">卷积结构，更接近平移等变</text>
  <g stroke="#6B7280" stroke-width="2.5" fill="none" marker-end="url(#ah)">
    <line x1="238" y1="431" x2="436" y2="431"/>
    <line x1="960" y1="431" x2="1158" y2="431"/>
  </g>
</svg>
